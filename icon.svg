  </g>

  <!-- wordmark -->
  <text x="256" y="396" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="56" letter-spacing="7" fill="#ff2a7d" opacity=".55" filter="url(#glow)">PÉCADO</text>
  <text x="256" y="396" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="56" letter-spacing="7" fill="url(#word)">PÉCADO</text>
