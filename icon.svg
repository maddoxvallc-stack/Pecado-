    <circle cx="448" cy="64" r="2.5" opacity=".6"/>
    <circle cx="430" cy="150" r="2" opacity=".5"/>
    <circle cx="86" cy="170" r="2" opacity=".5"/>
    <circle cx="60" cy="430" r="2.5" opacity=".5"/>
    <circle cx="456" cy="440" r="3" opacity=".6"/>
  </g>

  <g transform="translate(256 222) scale(.72) translate(-256 -257)">
