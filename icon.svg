<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0829"/>
      <stop offset="1" stop-color="#06020a"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a7d" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#9d1cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9d1cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="256" y1="185" x2="256" y2="410">
      <stop offset="0" stop-color="#ffa21f"/>
      <stop offset="0.55" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#ff1f7a"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
