    <path d="M312 268L268 285L302 306Z"/>
    <path d="M256 304L246 320L266 320Z"/>
    <path d="M188 332L215 350L226 340L244 362L256 350L268 362L286 340L297 350L324 332Q256 425 188 332Z"/>
  </g>
