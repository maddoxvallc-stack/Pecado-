<style>
* {

}

body {
    margin: 0;

    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
}

.logo {
    text-align: center;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 4px;
    text-shadow: 0 0 25px rgba(255, 50, 120, .7);
}

.subtitle {
    text-align: center;
    color: #d9a9c5;
    margin-bottom: 25px;
}

.card {
    background: rgba(25, 10, 28, .88);
    border: 1px solid rgba(255, 100, 170, .22);
    border-radius: 25px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    backdrop-filter: blur(12px);
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 14px;
    border: 1px solid #653052;
    background: #160b18;
    color: white;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 16px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    color: white;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.12);
}

.primary {
    background: linear-gradient(135deg, #ff287d, #9d1cff);
}

.category {
    padding: 24px 15px;
    font-size: 21px;
}

.pasado {
    background: linear-gradient(135deg, #6d2cff, #d026ff);
}

.deseo {
    background: linear-gradient(135deg, #ff236d, #ff7b22);
}

.trago {
    background: linear-gradient(135deg, #8e1515, #e52d27);
}

.intensity {
    padding: 22px 15px;
}

.warm {
    background: linear-gradient(135deg, #e88b19, #ffbd39);
}

.spicy {
    background: linear-gradient(135deg, #ff326d, #ff176b);
}

.pecado {
    background: linear-gradient(135deg, #a600ff, #ff006a);
}

.question-card {
    text-align: center;
    padding: 20px 5px;
}

.player {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ff76b5;
    font-weight: 800;
}

.category-label {
    color: #cba7c9;
    font-size: 13px;
    margin-top: 7px;
}

.question {
    font-size: 27px;
    line-height: 1.35;
    font-weight: 750;
    margin: 30px 5px;
}

.drink {
    background: linear-gradient(135deg, #6d1111, #d93636);
}

.skip {
    background: #342038;
}

.next {
    background: linear-gradient(135deg, #ff287d, #a21cff);
}

.back {
    background: transparent;
    border: 1px solid #56304f;
    color: #c9a9c1;
    font-size: 13px;
    margin-top: 18px;
}

.counter {
    text-align: center;
    color: #8f7189;
    font-size: 12px;
    margin-top: 15px;
}

.error {
    color: #ff789d;
    text-align: center;
    margin-bottom: 10px;
    min-height: 20px;
}

@media (max-width: 500px) {
    .logo {
        font-size: 40px;
    }

    .card {
        padding: 22px 18px;
    }

    .question {
        font-size: 23px;
    }
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(5,2,8,.78);
    backdrop-filter:blur(10px);
    align-items:center;
    justify-content:center;
    padding:20px;
}
.modal.show{display:flex;}
.modal-box{
    width:100%;
    max-width:430px;
    text-align:center;
    background:linear-gradient(160deg,#2a102d,#100811);
    border:1px solid rgba(255,80,150,.35);
    border-radius:28px;
    padding:32px 24px 24px;
    box-shadow:0 25px 90px rgba(0,0,0,.65);
    animation:pop .22s ease-out;
}
.modal-icon{font-size:52px;margin-bottom:5px;}
.modal-box h2{margin-bottom:12px;color:#ff76b5;}
.modal-text{font-size:19px;line-height:1.45;color:#f4ddea;margin:12px 0 22px;}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}

</head>

<div id="startScreen" class="screen active">

</div>

<div id="categoryScreen" class="screen">

</div>


<!-- INTENSITY -->
<div id="intensityScreen" class="screen">

    <button class="back" onclick="showCategoryScreen()">

</div>


<!-- GAME -->
<div id="gameScreen" class="screen">

        <div class="counter" id="counter"></div>

        <button class="back" onclick="backToIntensity()">

    </div>
</div>

</div>
</div>

/* =========================================================
   ESTADO DEL JUEGO
========================================================= */

let players = [];
let currentPlayer = 0;
let currentCategory = "";
let currentIntensity = "";
let questionNumber = 0;

let usedQuestions = {
    past: {
        warm: [],
        spicy: [],
        pecado: []
    },
    desire: {
        warm: [],
        spicy: [],
        pecado: []
    },
    drink: {
        warm: [],
        spicy: [],
        pecado: []
    }
};


/* =========================================================
   FUNCIONES GENERALES
========================================================= */

function showScreen(id) {

    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}


function startGame() {

    const p1 = document.getElementById("player1").value.trim();
    const p2 = document.getElementById("player2").value.trim();

    if (!p1 || !p2) {
        document.getElementById("nameError").textContent =
            "Escribe los nombres de los dos jugadores.";
        return;
    }

    players = [p1, p2];

    currentPlayer = 0;
    questionNumber = 0;

    saveGame();
    showCategoryScreen();
}


function showCategoryScreen() {
    showScreen("categoryScreen");
}


function chooseCategory(category) {

    currentCategory = category;

    showScreen("intensityScreen");
}


function chooseIntensity(intensity) {

    currentIntensity = intensity;

    showScreen("gameScreen");

    saveGame();
    showQuestion();
}


function getQuestions() {

    return questions[currentCategory][currentIntensity];
}


function getCategoryName() {

    const names = {
        past: "🔥 PASADO",
        desire: "😈 DESEO",
        drink: "🍷 TRAGO"
    };

    return names[currentCategory];
}


function getIntensityName() {

    const names = {
        warm: "🌶️ CALIENTE",
        spicy: "🌶️🌶️ MUY PICANTE",
        pecado: "🌶️🌶️🌶️ PÉCADO"
    };

    return names[currentIntensity];
}


/* =========================================================
   MOSTRAR PREGUNTA
========================================================= */

function showQuestion() {

    const list = getQuestions();

    let used = usedQuestions[currentCategory][currentIntensity];

    /*
       Si ya se usaron todas las preguntas de esta combinación,
       se reinicia solamente esa combinación.
    */

    if (used.length >= list.length) {
        usedQuestions[currentCategory][currentIntensity] = [];
        used = [];
    }

    let randomIndex;

    do {
        randomIndex = Math.floor(Math.random() * list.length);
    } while (used.includes(randomIndex));

    used.push(randomIndex);
    saveGame();

    const question = list[randomIndex];

    document.getElementById("playerName").textContent =
        "TURNO DE " + players[currentPlayer];

    document.getElementById("categoryName").textContent =
        getCategoryName() + " • " + getIntensityName();

    document.getElementById("questionText").textContent =
        question;

    document.getElementById("counter").textContent =
        `${used.length} / ${list.length} preguntas usadas`;
}


/* =========================================================
   SIGUIENTE PREGUNTA
========================================================= */

function nextQuestion() {

    currentPlayer = currentPlayer === 0 ? 1 : 0;

    questionNumber++;

    saveGame();
    showQuestion();
}


/* =========================================================
   BEBER
========================================================= */

function takeDrink() {
    const penalties = [
        "Toma 1 trago 🍷",
        "Toma 2 tragos 🍷🍷",
        "Toma 3 tragos 🍷🍷🍷",
        "Toma un trago largo 🍷",
        "Tu pareja elige cuánto tomas 😈"
    ];
    const penalty = penalties[Math.floor(Math.random() * penalties.length)];
    document.getElementById("drinkTitle").textContent = "¡A BEBER, " + players[currentPlayer].toUpperCase() + "!";
    document.getElementById("drinkText").textContent = penalty;
    document.getElementById("drinkModal").classList.add("show");
    localStorage.setItem("pecado_last_action", JSON.stringify({player:players[currentPlayer], action:"drink", time:Date.now()}));
}


/* =========================================================
   SALTAR
========================================================= */

function skipQuestion() {
    document.getElementById("drinkTitle").textContent = "PREGUNTA SALTADA 😈";
    document.getElementById("drinkText").textContent =
        players[currentPlayer] + " saltó. Penalización: 2 tragos 🍷🍷";
    document.getElementById("drinkModal").classList.add("show");
    localStorage.setItem("pecado_last_action", JSON.stringify({player:players[currentPlayer], action:"skip", time:Date.now()}));
}

function closeDrink() {
    document.getElementById("drinkModal").classList.remove("show");
    nextQuestion();
}


/* =========================================================
   VOLVER A ELEGIR
========================================================= */

function backToCategories() {

    showCategoryScreen();
}


function backToIntensity() {

    showScreen("intensityScreen");
}


/* =========================================================
   PWA + GUARDADO LOCAL
========================================================= */
let deferredInstallPrompt = null;

window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    document.getElementById("installBar").style.display = "block";
});

async function installApp() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById("installBar").style.display = "none";
}

function saveGame() {
    localStorage.setItem("pecado_state", JSON.stringify({
        players, currentPlayer, currentCategory, currentIntensity,
        questionNumber, usedQuestions
    }));
}

function loadSavedNames() {
    try {
        const saved = JSON.parse(localStorage.getItem("pecado_state"));
        if (saved && saved.players && saved.players.length === 2) {
            document.getElementById("player1").value = saved.players[0] || "";
            document.getElementById("player2").value = saved.players[1] || "";
        }
    } catch(e) {}
}

window.addEventListener("load", () => {
    loadSavedNames();
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
});

</script>
